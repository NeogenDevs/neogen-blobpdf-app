services:
  grafana:
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana
    # The base file in .config/ is generated by @grafana/create-plugin and still
    # carries the old plugin id, so override the id-specific settings here.
    environment:
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: neogentest-blobpdf-app
      GF_LOG_FILTERS: plugin.neogentest-blobpdf-app:debug
